  <form id="auth-form" class="auth-card">
    <h1 id="a-title">с возвращением</h1>
    <input id="a-user" placeholder="ник" autocomplete="username" required>
    <div class="pw">
      <input id="a-pass" type="password" placeholder="пароль" autocomplete="current-password" required>
      <button type="button" id="a-eye" class="eye" aria-label="показать пароль" aria-pressed="false">
        <svg class="i eye-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>

      </button>
    </div>
    <div id="a-err" class="error" role="alert"></div>
    <button type="submit" id="a-submit">войти</button>
    <div id="tg-login" class="tg-login hidden"></div>
    <a href="#" id="a-toggle" class="link">нет аккаунта? зарегистрироваться</a>
  </form>
