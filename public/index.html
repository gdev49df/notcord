<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a1722">
<title>notcord</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="sky" aria-hidden="true"><i class="sun"></i></div>

<div id="auth" class="auth hidden">
  <div class="auth-hero">
    <div class="wordmark">notcord</div>
    <p>свои серверы, свои правила. пиши, звони и делись файлами без лишних ограничений.</p>
  </div>
  <form id="auth-form" class="auth-card">
    <h1 id="a-title">с возвращением</h1>
    <input id="a-user" placeholder="ник" autocomplete="username" required>
    <input id="a-pass" type="password" placeholder="пароль" autocomplete="current-password" required>
    <div id="a-err" class="error" role="alert"></div>
    <button type="submit" id="a-submit">войти</button>
    <a href="#" id="a-toggle" class="link">нет аккаунта? зарегистрироваться</a>
  </form>
</div>

<div id="app" class="app hidden">
  <nav id="rail" class="rail panel"></nav>
  <aside id="side" class="side panel">
    <div id="side-head" class="side-head"></div>
    <div id="side-list" class="side-list"></div>
    <div id="voice-bar" class="voice-bar hidden"></div>
    <div class="me-bar">
      <div class="avatar" id="me-avatar"></div>
      <div class="me-name" id="me-name"></div>
      <button id="logout" class="icon-btn" title="выйти" aria-label="выйти"><svg class="i" viewBox="0 0 24 24"><path d="M9 4H5v16h4M15 8l4 4-4 4M19 12H9"/></svg></button>
    </div>
  </aside>
  <main id="main" class="main panel">
    <header id="main-head" class="main-head"></header>
    <section id="view" class="view"></section>
  </main>
  <aside id="members" class="members panel"></aside>
</div>

<div id="modal" class="modal hidden"><div class="modal-card" id="modal-card"></div></div>
<div id="audio-sink"></div>
<script src="app.js"></script>
</body>
</html>
