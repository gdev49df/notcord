<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>notcord</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="auth" class="auth hidden">
  <form id="auth-form" class="auth-card">
    <h1>notcord</h1>
    <p class="muted">общайся без лишних ограничений</p>
    <input id="a-user" placeholder="ник" autocomplete="username" required>
    <input id="a-pass" type="password" placeholder="пароль" autocomplete="current-password" required>
    <div id="a-err" class="error"></div>
    <button type="submit" id="a-submit">войти</button>
    <a href="#" id="a-toggle" class="link">нет аккаунта? зарегистрироваться</a>
  </form>
</div>

<div id="app" class="app hidden">
  <nav id="rail" class="rail"></nav>
  <aside id="side" class="side">
    <div id="side-head" class="side-head"></div>
    <div id="side-list" class="side-list"></div>
    <div id="voice-bar" class="voice-bar hidden"></div>
    <div class="me-bar">
      <div class="avatar" id="me-avatar"></div>
      <div class="me-name" id="me-name"></div>
      <button id="logout" class="icon-btn" title="выйти">⎋</button>
    </div>
  </aside>
  <main id="main" class="main">
    <header id="main-head" class="main-head"></header>
    <section id="view" class="view"></section>
  </main>
  <aside id="members" class="members"></aside>
</div>

<div id="modal" class="modal hidden"><div class="modal-card" id="modal-card"></div></div>
<div id="audio-sink"></div>
<script src="app.js"></script>
</body>
</html>
